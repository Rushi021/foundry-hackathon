[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "foundry"
version = "0.1.0"
description = "AI consultancy platform — founder workflow POC"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "langchain>=0.3.0",
  "langchain-openai>=0.3.0",
  "langgraph>=0.3.0",
  "langsmith>=0.3.0",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "openai>=1.66.0",
  "supabase>=2.0.0",
  "python-dotenv>=1.0.0",
  "httpx>=0.27.0",
  "PyJWT[crypto]>=2.8.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.8.0",
]

[project.scripts]
foundry = "foundry.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/foundry"]

[tool.hatch.build.targets.wheel.force-include]
"src/foundry" = "foundry"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
